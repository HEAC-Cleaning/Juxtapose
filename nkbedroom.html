<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.knightlab.com/libs/juxtapose/latest/css/juxtapose.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Stable container for Wix */
    #juxtapose-container {
      width: 100%;
      height: 600px;
      max-width: 100%;
    }

    .jx-slider img {
      object-fit: cover;
    }
  </style>
</head>

<body>
  <div id="juxtapose-container"></div>

  <script src="https://cdn.knightlab.com/libs/juxtapose/latest/js/juxtapose.js"></script>

  <script>
    const beforeImg = new Image();
    const afterImg = new Image();

    beforeImg.src = "https://raw.githubusercontent.com/HEAC-Cleaning/Juxtapose/main/nkbedroom2before.jpeg";
    afterImg.src = "https://raw.githubusercontent.com/HEAC-Cleaning/Juxtapose/main/nkbedroom2after.jpeg";

    function initSlider() {
      new juxtapose.JXSlider('#juxtapose-container',
        [
          {
            src: beforeImg.src,
            label: 'Before'
          },
          {
            src: afterImg.src,
            label: 'After'
          }
        ],
        {
          animate: true,
          showLabels: true,
          showCredits: false,
          startingPosition: "50%",
          makeResponsive: true
        }
      );
    }

    // Load both images first
    let loaded = 0;
    function checkLoaded() {
      loaded++;
      if (loaded === 2) initSlider();
    }

    beforeImg.onload = checkLoaded;
    afterImg.onload = checkLoaded;

    // Fallback: if GitHub is slow, still load after 1 second
    setTimeout(() => {
      if (loaded < 2) initSlider();
    }, 1000);
  </script>
</body>
</html>
