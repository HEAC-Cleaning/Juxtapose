<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KC Shower – Before & After</title>

  <!-- Juxtapose CSS -->
  <link rel="stylesheet" href="https://cdn.knightlab.com/libs/juxtapose/latest/css/juxtapose.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Stable container for Wix */
    #kc-shower-slider {
      width: 100%;
      height: 600px; /* prevents iframe collapse */
      max-width: 100%;
    }

    .wrapper {
      max-width: 900px;
      margin: 0 auto;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div id="kc-shower-slider"></div>
  </div>

  <!-- Juxtapose JS -->
  <script src="https://cdn.knightlab.com/libs/juxtapose/latest/js/juxtapose.min.js"></script>

  <script>
    // Delay ensures Wix iframe + images load first
    setTimeout(() => {
      new juxtapose.JXSlider('#kc-shower-slider',
        [
          {
            src: 'https://raw.githubusercontent.com/HEAC-Cleaning/Juxtapose/main/nkbedroom2before.jpeg',
            label: 'Before'
          },
          {
            src: 'https://raw.githubusercontent.com/HEAC-Cleaning/Juxtapose/main/nkbedroom2after.jpg',
            label: 'After'
          }
        ],
        {
          animate: true,
          showLabels: true,
          showCredits: false,
          startingPosition: "50%",
          makeResponsive: true
        }
      );
    }, 300);
  </script>
</body>
</html>
